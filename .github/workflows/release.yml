name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump (patch = 1.0.0 → 1.0.1, minor = 1.1.0, major = 2.0.0)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      play_track:
        description: "Google Play track"
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
          - none
      app_distribution:
        description: "Send the APK to Firebase App Distribution"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Bump, build, tag and distribute
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: br.com.joaoduartemariucio.rodaro
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
      PLAY_TRACK: ${{ inputs.play_track }}
      SEND_TO_APP_DISTRIBUTION: ${{ inputs.app_distribution }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      PLAY_NOTES_LANGUAGE: ${{ vars.PLAY_NOTES_LANGUAGE || 'pt-BR' }}
    steps:
      - name: Only release from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases bump the version on the branch they run from; run this workflow on main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          bash scripts/bump_version.sh "$BUMP" version.properties >> "$GITHUB_ENV"
          . ./version.properties
          TAG="v$VERSION_NAME"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists; bump a different part or fix version.properties."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          {
            echo "Rodaro $VERSION_NAME ($VERSION_CODE)"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty='- %s' --no-merges "$PREVIOUS_TAG..HEAD" | head -n 30
            else
              git log --pretty='- %s' --no-merges -n 10
            fi
          } > "$RUNNER_TEMP/release-notes.txt"
          cat "$RUNNER_TEMP/release-notes.txt"

      - name: Commit and tag the new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): $TAG ($VERSION_CODE)"
          git tag -a "$TAG" -F "$RUNNER_TEMP/release-notes.txt"

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK and bundle
        env:
          OPEN_ROUTE_API_KEY: ${{ secrets.OPEN_ROUTE_API_KEY }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --console=plain :app:assembleRelease :app:bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Push the version commit and tag
        run: git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$TAG"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rodaro-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Send to Firebase App Distribution
        if: env.SEND_TO_APP_DISTRIBUTION == 'true' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase.json"
          APP_ID=$(jq -r --arg pkg "$PACKAGE_NAME" \
            '.client[] | select(.client_info.android_client_info.package_name == $pkg) | .client_info.mobilesdk_app_id' \
            app/google-services.json)
          npx --yes firebase-tools@14 appdistribution:distribute \
            app/build/outputs/apk/release/app-release.apk \
            --app "$APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          rm -f "$RUNNER_TEMP/firebase.json"

      - name: App Distribution skipped
        if: env.SEND_TO_APP_DISTRIBUTION == 'true' && env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT is not set; the APK was not sent to App Distribution."

      - name: Prepare Play release notes
        if: env.PLAY_TRACK != 'none' && env.PLAY_SERVICE_ACCOUNT != ''
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          python3 -c 'import sys; sys.stdout.write(open(sys.argv[1], encoding="utf-8").read()[:500])' \
            "$RUNNER_TEMP/release-notes.txt" > "$RUNNER_TEMP/whatsnew/whatsnew-$PLAY_NOTES_LANGUAGE"

      - name: Send to Google Play
        if: env.PLAY_TRACK != 'none' && env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_RELEASE_STATUS }}
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Google Play skipped
        if: env.PLAY_TRACK != 'none' && env.PLAY_SERVICE_ACCOUNT == ''
        run: echo "::warning::PLAY_SERVICE_ACCOUNT is not set; the bundle was not sent to Google Play."
