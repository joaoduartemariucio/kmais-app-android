<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rodaro</title>
  <meta name="description" content="Abastecimentos, consumo, custo por km e lembretes de manutenção dos seus carros e motos.">
  <style>
    :root { --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --accent: #23d2b5; --brand: #0e131d; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --muted: #98989f; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; width: 100%; background: var(--card); border-radius: 24px; padding: 40px 28px; text-align: center; }
    .logo { width: 96px; height: 96px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; margin: 0 auto 20px; }
    .logo span { color: var(--accent); font-size: 56px; font-weight: 800; line-height: 1; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    .links { margin-top: 24px; font-size: 15px; }
    .links a { color: #0f9e86; }
    @media (prefers-color-scheme: dark) { .links a { color: var(--accent); } }
  </style>
</head>
<body>
  <main>
    <div class="logo"><span>R</span></div>
    <h1>Rodaro</h1>
    <p>Abastecimentos, consumo, custo por km e lembretes de manutenção dos seus carros e motos.</p>
    <p class="links"><a href="/privacidade">Política de Privacidade</a></p>
  </main>
</body>
</html>
